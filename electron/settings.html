<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tally Connector Settings</title>
<style>
  :root {
    --primary: #5b3cc4;
    --border: #d9d9e3;
    --bg: #faf9fc;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color: #1f2028;
    font-size: 13px;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #status.error { color: #b3261e; }
  #status.ok { color: #1a7f37; }
  main { padding: 16px 20px 90px; }
  section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .row {
    display: grid;
    grid-template-columns: 160px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .row label { color: #33343e; }
  .row input[type="text"], .row input[type="number"], .row input[type="password"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .checks label { display: flex; align-items: center; gap: 8px; }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--primary); color: white; }
  button.secondary { background: white; border: 1px solid var(--border); color: #1f2028; }
  button:disabled { opacity: 0.6; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <h1>Tally Connector</h1>
    <span id="status">Loading…</span>
  </header>

  <main>
    <section>
      <h2>MEVA ERP connection</h2>
      <div class="row">
        <label>Server URL</label>
        <input id="mevaApiBaseUrl" type="text" placeholder="http://localhost:3000" />
      </div>
      <div class="row">
        <label>API key</label>
        <input id="mevaApiKey" type="password" placeholder="from CONNECTOR_API_KEY in MEVA's .env" />
      </div>
    </section>

    <section>
      <h2>TallyPrime connection</h2>
      <div class="row">
        <label>Company name</label>
        <input id="tallyCompanyName" type="text" placeholder="exact name as shown in TallyPrime" />
      </div>
      <div class="row">
        <label>Host</label>
        <input id="tallyHost" type="text" placeholder="127.0.0.1" />
      </div>
      <div class="row">
        <label>Port</label>
        <input id="tallyPort" type="number" placeholder="9000" />
      </div>
      <p class="hint">TallyPrime: F1 (Help) &rarr; Settings &rarr; Connectivity &rarr; Client/Server configuration. Turn ODBC Server On.</p>
    </section>

    <section>
      <h2>Chart of accounts (must match TallyPrime exactly)</h2>
      <div class="row"><label>Debtors group</label><input id="tallyDebtorsGroup" type="text" /></div>
      <div class="row"><label>Creditors group</label><input id="tallyCreditorsGroup" type="text" /></div>
      <div class="row"><label>Stock group</label><input id="tallyStockGroup" type="text" /></div>
      <div class="row"><label>Sales ledger</label><input id="tallySalesLedger" type="text" /></div>
      <div class="row"><label>Purchase ledger</label><input id="tallyPurchaseLedger" type="text" /></div>
      <div class="row"><label>CGST ledger</label><input id="tallyCgstLedger" type="text" /></div>
      <div class="row"><label>SGST ledger</label><input id="tallySgstLedger" type="text" /></div>
      <div class="row"><label>IGST ledger</label><input id="tallyIgstLedger" type="text" /></div>
      <div class="row"><label>Round off ledger</label><input id="tallyRoundoffLedger" type="text" /></div>
      <div class="row"><label>Bank ledger</label><input id="tallyBankLedger" type="text" /></div>
      <div class="row"><label>Cash ledger</label><input id="tallyCashLedger" type="text" /></div>
    </section>

    <section>
      <h2>What to sync</h2>
      <div class="checks">
        <label><input type="checkbox" id="sync_customers" /> Customers</label>
        <label><input type="checkbox" id="sync_suppliers" /> Vendors</label>
        <label><input type="checkbox" id="sync_items" /> Items</label>
        <label><input type="checkbox" id="sync_salesInvoices" /> Sales invoices</label>
        <label><input type="checkbox" id="sync_purchaseInvoices" /> Purchase invoices</label>
        <label><input type="checkbox" id="sync_receipts" /> Receipts</label>
        <label><input type="checkbox" id="sync_stockAdjustments" /> Stock adjustments</label>
      </div>
    </section>

    <section>
      <h2>Timing</h2>
      <div class="row">
        <label>Sync every (minutes)</label>
        <input id="syncIntervalMinutes" type="number" min="1" placeholder="15" />
      </div>
    </section>
  </main>

  <footer>
    <button class="secondary" id="syncNowBtn">Sync Now</button>
    <button class="primary" id="saveBtn">Save</button>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
